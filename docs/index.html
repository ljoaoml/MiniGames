<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Fazenda</title>
<style>
  :root {
    --wood-dark: #4c3824;
    --wood-mid: #6b4e30;
    --wood-light: #8a6540;
    --panel: #57402a;
    --gold: #ffd23c;
    --coin: #fff08c;
    --text: #fdf6e3;
    --danger: #ff7a6e;
    --ok: #8fe38a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1c1712;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1100px;
    max-height: 780px;
    margin: 0 auto;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
</div>
<script>
"use strict";

/* ------------------------------------------------------------------
 * Mini Fazenda - versão browser (Canvas 2D)
 * Porte do protótipo pygame, com visual redesenhado.
 * Todo o "art" é desenhado em código (gradientes/formas), sem
 * assets externos, pra rodar direto em GitHub Pages sem build.
 * ------------------------------------------------------------------ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const BASE_W = 1000, BASE_H = 720;
let scale = 1;

function resize() {
  const stage = document.getElementById("stage");
  const rect = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(rect.width / BASE_W, rect.height / BASE_H);
  canvas.width = Math.round(BASE_W * scale * dpr);
  canvas.height = Math.round(BASE_H * scale * dpr);
  canvas.style.width = Math.round(BASE_W * scale) + "px";
  canvas.style.height = Math.round(BASE_H * scale) + "px";
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
}
window.addEventListener("resize", resize);

/* ---------------- Grid isométrico ---------------- */

const TILE_W = 128, TILE_H = 74;
const COLS = 5, ROWS = 4;
const STARTING_UNLOCKED = 10;
const ORIGIN_X = BASE_W / 2, ORIGIN_Y = 300;

function tileCenter(col, row) {
  return [
    ORIGIN_X + (col - row) * (TILE_W / 2),
    ORIGIN_Y + (col + row) * (TILE_H / 2),
  ];
}
function pointInTile(px, py, col, row) {
  const [cx, cy] = tileCenter(col, row);
  const dx = Math.abs(px - cx) / (TILE_W / 2);
  const dy = Math.abs(py - cy) / (TILE_H / 2);
  return dx + dy <= 1.0;
}

/* ---------------- Plantações ---------------- */

const CROPS = {
  batata:  { nome: "Batata",   custo: 5,  tempo: 8,  venda: 12, xp: 5,  nivelMin: 1, cor: "#d9a441", cor2: "#8a5a22" },
  milho:   { nome: "Milho",    custo: 10, tempo: 15, venda: 22, xp: 10, nivelMin: 1, cor: "#f4d35e", cor2: "#c9971f" },
  morango: { nome: "Morango",  custo: 20, tempo: 25, venda: 45, xp: 18, nivelMin: 3, cor: "#e8434f", cor2: "#7fbf5a" },
};
const CROP_ORDER = ["batata", "milho", "morango"];

/* ---------------- Estado ---------------- */

const plots = [];
for (let i = 0; i < COLS * ROWS; i++) {
  plots.push({
    unlocked: i < STARTING_UNLOCKED,
    custoOuro: 30 + Math.max(0, i - STARTING_UNLOCKED) * 15,
    crop: null,
    plantedAt: null,
    pest: false,
  });
}

const state = {
  moedas: 40,
  ouro: 90,
  nivel: 1,
  xp: 0,
  xpMeta: 30,
  selectedCrop: "batata",
  event: null,
  nextEventAt: performance.now() / 1000 + 20,
};

/* ---------------- Eventos (encomendas urgentes / pragas) ----------------
 * A fazenda é persistente (sem "fim de run"), mas de tempos em tempos surge
 * uma pressão temporária: uma encomenda com prazo (colha X de uma cultura)
 * ou uma praga isolada numa plantação (espante clicando antes do tempo
 * acabar, senão a plantação é perdida). É o "tempo real com pressão"
 * emprestado do 9 Kings, aplicado à fazenda em vez de combate. */

function agendarProximoEvento(now) {
  state.nextEventAt = now + 28 + Math.random() * 24;
}

function dispararEvento(now) {
  const plantadosCrescendo = plots
    .map((p, i) => ({ p, i }))
    .filter(({ p }) => p.unlocked && p.crop !== null && !p.pest);
  const tipo = plantadosCrescendo.length > 0 && Math.random() < 0.45 ? "praga" : "encomenda";

  if (tipo === "praga") {
    const alvo = plantadosCrescendo[(Math.random() * plantadosCrescendo.length) | 0];
    alvo.p.pest = true;
    state.event = { type: "praga", plotIndex: alvo.i, startedAt: now, duration: 10 + Math.random() * 4 };
    const [px, py] = tileCenter(alvo.i % COLS, (alvo.i / COLS) | 0);
    addFloater("Praga!", [px - 18, py - 50], "#ff7a6e");
  } else {
    const disponiveis = cropsDisponiveis();
    const cropId = disponiveis[(Math.random() * disponiveis.length) | 0];
    const qtd = 2 + ((Math.random() * 3) | 0);
    state.event = { type: "encomenda", cropId, qtd, coletado: 0, startedAt: now, duration: 38 + Math.random() * 12 };
  }
}

function resolverEventoFalha() {
  const ev = state.event;
  if (ev.type === "praga") {
    const plot = plots[ev.plotIndex];
    if (plot.pest) {
      plot.pest = false;
      plot.crop = null;
      plot.plantedAt = null;
      const [px, py] = tileCenter(ev.plotIndex % COLS, (ev.plotIndex / COLS) | 0);
      addFloater("Plantação perdida!", [px - 30, py], "#ff7a6e");
    }
  }
  state.event = null;
}

function espantarPraga(index) {
  const plot = plots[index];
  if (!plot.pest) return false;
  plot.pest = false;
  state.ouro += 8;
  const [px, py] = tileCenter(index % COLS, (index / COLS) | 0);
  addFloater("Praga espantada! +8 ouro", [px - 40, py - 20], "#8fe38a");
  if (state.event && state.event.type === "praga" && state.event.plotIndex === index) {
    state.event = null;
    agendarProximoEvento(performance.now() / 1000);
  }
  return true;
}

function updateEventos(now) {
  if (state.event === null) {
    if (now >= state.nextEventAt) dispararEvento(now);
    return;
  }
  if (now - state.event.startedAt > state.event.duration) {
    resolverEventoFalha();
    agendarProximoEvento(now);
  }
}

const floaters = [];
function addFloater(text, pos, color) {
  floaters.push({ text, pos, color: color || "#fdf6e3", t0: performance.now() });
}

function cropsDisponiveis() {
  return CROP_ORDER.filter((c) => CROPS[c].nivelMin <= state.nivel);
}

function ouroPorNivel(nivel) {
  return 20 + (nivel - 1) * 10;
}

function ganharXp(qtd) {
  state.xp += qtd;
  while (state.xp >= state.xpMeta) {
    state.xp -= state.xpMeta;
    state.nivel += 1;
    state.xpMeta = 30 + (state.nivel - 1) * 20;
    const ouroGanho = ouroPorNivel(state.nivel);
    state.ouro += ouroGanho;
    addFloater(`Nivel ${state.nivel}!`, [BASE_W / 2 - 40, BASE_H / 2], "#ffd23c");
    addFloater(`+${ouroGanho} ouro`, [BASE_W / 2 - 30, BASE_H / 2 + 24], "#ffd23c");
    for (const c of CROP_ORDER) {
      if (CROPS[c].nivelMin === state.nivel) {
        addFloater(`${CROPS[c].nome} liberado!`, [BASE_W / 2 - 60, BASE_H / 2 + 48], "#8fe38a");
      }
    }
  }
}

/* ---------------- Ações ---------------- */

function tentarPlantar(index) {
  const plot = plots[index];
  if (!plot.unlocked || plot.crop !== null) return;
  const cropId = state.selectedCrop;
  const crop = CROPS[cropId];
  const col = index % COLS, row = (index / COLS) | 0;
  const pos = tileCenter(col, row);
  if (crop.nivelMin > state.nivel) { addFloater("Bloqueado!", pos, "#ff7a6e"); return; }
  if (state.moedas < crop.custo) { addFloater("Moedas insuf.!", pos, "#ff7a6e"); return; }
  state.moedas -= crop.custo;
  plot.crop = cropId;
  plot.plantedAt = performance.now() / 1000;
}

function tentarColher(index) {
  const plot = plots[index];
  if (plot.crop === null || plot.pest) return;
  const cropId = plot.crop;
  const crop = CROPS[cropId];
  const elapsed = performance.now() / 1000 - plot.plantedAt;
  if (elapsed < crop.tempo) return;
  const col = index % COLS, row = (index / COLS) | 0;
  const pos = tileCenter(col, row);
  state.moedas += crop.venda;
  ganharXp(crop.xp);
  addFloater(`+${crop.venda} moedas`, [pos[0] - 20, pos[1] - 40], "#fff08c");
  plot.crop = null;
  plot.plantedAt = null;

  const ev = state.event;
  if (ev && ev.type === "encomenda" && ev.cropId === cropId) {
    ev.coletado += 1;
    if (ev.coletado >= ev.qtd) {
      const bonus = 12 + ev.qtd * 4;
      state.ouro += bonus;
      addFloater(`Encomenda entregue! +${bonus} ouro`, [BASE_W / 2 - 90, 110], "#ffd23c");
      state.event = null;
      agendarProximoEvento(performance.now() / 1000);
    }
  }
}

function tentarDesbloquear(index) {
  const plot = plots[index];
  if (plot.unlocked) return;
  const custo = plot.custoOuro;
  const col = index % COLS, row = (index / COLS) | 0;
  const pos = tileCenter(col, row);
  if (state.ouro < custo) { addFloater("Ouro insuf.!", pos, "#ff7a6e"); return; }
  state.ouro -= custo;
  plot.unlocked = true;
  addFloater("Terreno novo!", pos, "#8fe38a");
}

/* ---------------- Layout dos botões de semente ---------------- */

const CROP_BTN_Y = BASE_H - 86, CROP_BTN_W = 230, CROP_BTN_H = 62, CROP_BTN_GAP = 18;
function cropButtonRect(i) {
  const totalW = CROP_ORDER.length * CROP_BTN_W + (CROP_ORDER.length - 1) * CROP_BTN_GAP;
  const left = (BASE_W - totalW) / 2;
  const x = left + i * (CROP_BTN_W + CROP_BTN_GAP);
  return { x, y: CROP_BTN_Y, w: CROP_BTN_W, h: CROP_BTN_H };
}
function rectContains(r, x, y) {
  return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

/* ---------------- Desenho: helpers ---------------- */

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function diamondPath(cx, cy, w, h) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - h / 2);
  ctx.lineTo(cx + w / 2, cy);
  ctx.lineTo(cx, cy + h / 2);
  ctx.lineTo(cx - w / 2, cy);
  ctx.closePath();
}

/* pseudo-random determinístico por índice, pra textura de grama/terra ficar
   estável entre frames sem precisar guardar estado */
function hashNoise(seed) {
  let x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

function drawTileGrass(cx, cy, seedBase) {
  diamondPath(cx, cy, TILE_W, TILE_H);
  const grad = ctx.createLinearGradient(cx, cy - TILE_H / 2, cx, cy + TILE_H / 2);
  grad.addColorStop(0, "#8fd66a");
  grad.addColorStop(1, "#5fb24a");
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.save();
  ctx.clip();
  for (let i = 0; i < 14; i++) {
    const rx = hashNoise(seedBase + i * 3.1) - 0.5;
    const ry = hashNoise(seedBase + i * 7.7) - 0.5;
    const px = cx + rx * TILE_W * 0.8;
    const py = cy + ry * TILE_H * 0.8;
    ctx.fillStyle = hashNoise(seedBase + i) > 0.5 ? "rgba(255,255,255,0.10)" : "rgba(30,70,20,0.14)";
    ctx.beginPath();
    ctx.ellipse(px, py, 3.2, 1.6, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(30,60,20,0.35)";
  ctx.lineWidth = 1.5;
  diamondPath(cx, cy, TILE_W, TILE_H);
  ctx.stroke();
}

function drawTileSoil(cx, cy, seedBase) {
  diamondPath(cx, cy, TILE_W, TILE_H);
  const grad = ctx.createLinearGradient(cx, cy - TILE_H / 2, cx, cy + TILE_H / 2);
  grad.addColorStop(0, "#8a5a34");
  grad.addColorStop(1, "#5c3b1e");
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = "rgba(40,24,10,0.35)";
  ctx.lineWidth = 2;
  for (let r = -2; r <= 2; r++) {
    ctx.beginPath();
    ctx.moveTo(cx - TILE_W / 2 + 6, cy + r * 9);
    ctx.quadraticCurveTo(cx, cy + r * 9 + 5, cx + TILE_W / 2 - 6, cy + r * 9);
    ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(30,15,5,0.4)";
  ctx.lineWidth = 1.5;
  diamondPath(cx, cy, TILE_W, TILE_H);
  ctx.stroke();
}

function drawTileLocked(cx, cy) {
  diamondPath(cx, cy, TILE_W, TILE_H);
  const grad = ctx.createLinearGradient(cx, cy - TILE_H / 2, cx, cy + TILE_H / 2);
  grad.addColorStop(0, "#4a4640");
  grad.addColorStop(1, "#302d28");
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = 1.5;
  diamondPath(cx, cy, TILE_W, TILE_H);
  ctx.stroke();

  // cadeado
  ctx.save();
  ctx.translate(cx, cy - 6);
  ctx.fillStyle = "#d8c98a";
  roundRect(-9, -2, 18, 14, 3);
  ctx.fill();
  ctx.strokeStyle = "#d8c98a";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, -4, 7, Math.PI, 0);
  ctx.stroke();
  ctx.restore();
}

/* Estilo "Mini Fazenda": contorno grosso escuro + preenchimento saturado,
   cada cultura com silhueta própria em 4 estágios (não é a mesma forma
   recolorida). OUTLINE/OUTLINE_W dão o "traço de sticker" característico. */
const OUTLINE = "#2b1d12";
const OUTLINE_W = 2.2;

function fillStroke(fillColor) {
  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = OUTLINE_W;
  ctx.stroke();
}

function leafCluster(cx, cy, n, radius, leafW, leafH, color) {
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + 0.2;
    ctx.beginPath();
    ctx.ellipse(cx + Math.cos(ang) * radius, cy + Math.sin(ang) * radius * 0.6, leafW, leafH, ang, 0, Math.PI * 2);
    fillStroke(color);
  }
}

function drawCropShadow(cx, baseY) {
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.beginPath();
  ctx.ellipse(cx, baseY + 4, 20, 6, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawBatata(cx, cy, stage) {
  const baseY = cy + 6;
  drawCropShadow(cx, baseY);
  if (stage === 0) {
    // montinho de terra com 2 brotinhos
    ctx.beginPath();
    ctx.ellipse(cx, baseY, 12, 5, 0, 0, Math.PI * 2);
    fillStroke("#6b4526");
    leafCluster(cx, baseY - 6, 2, 4, 4, 2.2, "#6fc95a");
  } else if (stage === 1) {
    leafCluster(cx, baseY - 12, 5, 8, 7, 4, "#5fb24a");
    ctx.beginPath();
    ctx.ellipse(cx, baseY - 12, 6, 5, 0, 0, Math.PI * 2);
    fillStroke("#4a9a3a");
  } else if (stage === 2) {
    leafCluster(cx, baseY - 15, 6, 11, 8, 4.5, "#5fb24a");
    ctx.beginPath();
    ctx.ellipse(cx, baseY - 15, 7, 6, 0, 0, Math.PI * 2);
    fillStroke("#4a9a3a");
  } else {
    leafCluster(cx, baseY - 16, 5, 10, 7.5, 4, "#4a9a3a");
    // tubérculos saindo da terra
    ctx.beginPath();
    ctx.ellipse(cx, baseY, 18, 6, 0, 0, Math.PI * 2);
    fillStroke("#6b4526");
    const spuds = [[-8, -2, 8, 6], [7, -1, 7, 5.5], [0, 2, 6, 5]];
    for (const [dx, dy, w, h] of spuds) {
      ctx.beginPath();
      ctx.ellipse(cx + dx, baseY + dy, w, h, 0.15, 0, Math.PI * 2);
      fillStroke("#d9a441");
      ctx.fillStyle = "#8a5a22";
      ctx.beginPath(); ctx.arc(cx + dx - w * 0.3, baseY + dy, 1.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + dx + w * 0.3, baseY + dy + h * 0.2, 1.1, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawMilho(cx, cy, stage) {
  const baseY = cy + 6;
  drawCropShadow(cx, baseY);
  const h = 8 + stage * 9;
  // caule
  ctx.beginPath();
  ctx.moveTo(cx - 2, baseY);
  ctx.lineTo(cx - 1.5, baseY - h);
  ctx.lineTo(cx + 1.5, baseY - h);
  ctx.lineTo(cx + 2, baseY);
  fillStroke("#4f9e3f");
  // folhas em lâmina, uma de cada lado, crescem com o estágio
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx, baseY - h * 0.55);
    ctx.quadraticCurveTo(cx + side * (6 + stage * 3), baseY - h * 0.75, cx + side * (3 + stage), baseY - h * 0.3);
    ctx.quadraticCurveTo(cx + side * 1.5, baseY - h * 0.45, cx, baseY - h * 0.55);
    fillStroke("#5fb24a");
  }
  if (stage >= 3) {
    // espiga: cilindro amarelo com grãos + palha verde entreaberta
    const cobY = baseY - h - 4;
    ctx.beginPath();
    ctx.moveTo(cx - 5, cobY);
    ctx.quadraticCurveTo(cx - 6, cobY - 16, cx, cobY - 20);
    ctx.quadraticCurveTo(cx + 6, cobY - 16, cx + 5, cobY);
    ctx.closePath();
    fillStroke("#f4d35e");
    for (let row = 0; row < 4; row++) {
      for (let colI = -1; colI <= 1; colI++) {
        ctx.fillStyle = "#c9971f";
        ctx.beginPath();
        ctx.ellipse(cx + colI * 2.6, cobY - 3 - row * 4, 1.1, 1.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx, cobY - 18);
      ctx.quadraticCurveTo(cx + side * 7, cobY - 10, cx + side * 3, cobY + 2);
      ctx.quadraticCurveTo(cx + side * 1, cobY - 10, cx, cobY - 18);
      fillStroke("#7fbf5a");
    }
  } else if (stage === 2) {
    ctx.beginPath();
    ctx.ellipse(cx, baseY - h - 2, 3, 5, 0, 0, Math.PI * 2);
    fillStroke("#7fbf5a");
  }
}

function drawMorango(cx, cy, stage) {
  const baseY = cy + 6;
  drawCropShadow(cx, baseY);
  leafCluster(cx, baseY - 4, 3, 7, 6, 3.5, "#4a9a3a");
  if (stage === 1) {
    for (let i = 0; i < 3; i++) {
      const ang = (i / 3) * Math.PI * 2;
      const px = cx + Math.cos(ang) * 8, py = baseY - 6 + Math.sin(ang) * 4;
      ctx.beginPath();
      for (let p = 0; p < 5; p++) {
        const a = (p / 5) * Math.PI * 2;
        ctx.ellipse(px + Math.cos(a) * 2.6, py + Math.sin(a) * 2.6, 1.8, 1.2, a, 0, Math.PI * 2);
      }
      fillStroke("#fdf6e3");
    }
  } else if (stage === 2) {
    for (const [dx, dy] of [[-7, -2], [7, -3], [0, 3]]) {
      ctx.beginPath();
      ctx.ellipse(cx + dx, baseY - 4 + dy, 4, 5, 0, 0, Math.PI * 2);
      fillStroke("#7fbf5a");
    }
  } else if (stage === 3) {
    for (const [dx, dy] of [[-8, -1], [8, -2], [0, 5]]) {
      const py = baseY - 4 + dy;
      ctx.beginPath();
      ctx.moveTo(cx + dx, py - 6);
      ctx.quadraticCurveTo(cx + dx + 6, py - 2, cx + dx, py + 7);
      ctx.quadraticCurveTo(cx + dx - 6, py - 2, cx + dx, py - 6);
      fillStroke("#e8434f");
      ctx.fillStyle = "#f4d35e";
      for (const [sx, sy] of [[-2, -1], [2, 1], [0, 3], [-1.5, 2]]) {
        ctx.beginPath(); ctx.arc(cx + dx + sx, py + sy, 0.7, 0, Math.PI * 2); ctx.fill();
      }
      ctx.beginPath();
      ctx.ellipse(cx + dx, py - 6, 3.5, 2, 0, 0, Math.PI * 2);
      fillStroke("#5fb24a");
    }
  }
}

const CROP_DRAWERS = { batata: drawBatata, milho: drawMilho, morango: drawMorango };

function drawCrop(cx, cy, cropId, pct) {
  const stage = pct >= 1.0 ? 3 : pct >= 0.62 ? 2 : pct >= 0.28 ? 1 : 0;
  CROP_DRAWERS[cropId](cx, cy, stage);
}

/* ---------------- Decorações ---------------- */

function drawHouse() {
  const hx = ORIGIN_X + (COLS - ROWS) * (TILE_W / 4);
  const hy = 78;
  const w = 150, h = 110;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath();
  ctx.ellipse(0, h + 6, w * 0.5, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  // parede: cor viva chapada (estilo sticker), sem gradiente sutil
  ctx.beginPath();
  roundRect(-w / 2, h * 0.35, w, h * 0.65, 8);
  fillStroke("#f6dfa3");
  // tábuas horizontais (detalhe de madeira, não realismo)
  ctx.strokeStyle = "rgba(150,110,60,0.5)";
  ctx.lineWidth = 1.5;
  for (let ly = h * 0.48; ly < h * 0.95; ly += 12) {
    ctx.beginPath(); ctx.moveTo(-w / 2 + 4, ly); ctx.lineTo(w / 2 - 4, ly); ctx.stroke();
  }

  // telhado vermelho em duas águas, bem exagerado/brinquedo
  ctx.beginPath();
  ctx.moveTo(-w / 2 - 18, h * 0.4);
  ctx.lineTo(0, -14);
  ctx.lineTo(w / 2 + 18, h * 0.4);
  ctx.lineTo(w / 2 - 4, h * 0.4);
  ctx.lineTo(0, 8);
  ctx.lineTo(-w / 2 + 4, h * 0.4);
  ctx.closePath();
  fillStroke("#d1483a");
  ctx.beginPath();
  ctx.moveTo(-w / 2 - 18, h * 0.4);
  ctx.lineTo(0, -14);
  ctx.lineTo(0, 8);
  ctx.lineTo(-w / 2 + 4, h * 0.4);
  ctx.closePath();
  fillStroke("#a5352a");
  // chaminé
  ctx.beginPath();
  roundRect(w * 0.18, -6, 16, 26, 2);
  fillStroke("#c78a5a");
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.beginPath(); ctx.ellipse(w * 0.18 + 20, -18, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w * 0.18 + 28, -28, 8, 6, 0, 0, Math.PI * 2); ctx.fill();

  // porta arredondada com maçaneta
  ctx.beginPath();
  roundRect(-16, h * 0.6, 32, h * 0.4, 10);
  fillStroke("#8a5a34");
  ctx.fillStyle = "#f4d35e";
  ctx.beginPath(); ctx.arc(10, h * 0.6 + h * 0.2, 2, 0, Math.PI * 2); ctx.fill();

  // janela redonda com caixilho em cruz
  ctx.beginPath();
  ctx.arc(w * 0.24, h * 0.55, 15, 0, Math.PI * 2);
  fillStroke("#a7dbe8");
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = OUTLINE_W;
  ctx.beginPath();
  ctx.moveTo(w * 0.24 - 15, h * 0.55); ctx.lineTo(w * 0.24 + 15, h * 0.55);
  ctx.moveTo(w * 0.24, h * 0.55 - 15); ctx.lineTo(w * 0.24, h * 0.55 + 15);
  ctx.stroke();
  // jardineira de flores sob a janela
  ctx.beginPath();
  roundRect(w * 0.24 - 16, h * 0.55 + 16, 32, 8, 3);
  fillStroke("#8a5a34");
  for (const dx of [-9, 0, 9]) {
    ctx.beginPath();
    ctx.arc(w * 0.24 + dx, h * 0.55 + 14, 3, 0, Math.PI * 2);
    fillStroke(dx === 0 ? "#f4d35e" : "#e8434f");
  }
  ctx.restore();

  drawSilo(hx - 118, hy + 66);
  drawChicken(hx + 96, hy + h - 6);
}

function drawSilo(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = "rgba(0,0,0,0.16)";
  ctx.beginPath();
  ctx.ellipse(0, 40, 20, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // corpo cilíndrico
  ctx.beginPath();
  roundRect(-18, -14, 36, 54, 16);
  fillStroke("#d8dde0");
  ctx.strokeStyle = "rgba(120,130,135,0.5)";
  ctx.lineWidth = 1.5;
  for (const ly of [4, 16, 28]) {
    ctx.beginPath(); ctx.moveTo(-18, ly); ctx.lineTo(18, ly); ctx.stroke();
  }
  // telhado cônico
  ctx.beginPath();
  ctx.moveTo(-22, -12);
  ctx.lineTo(0, -38);
  ctx.lineTo(22, -12);
  ctx.closePath();
  fillStroke("#b0463a");
  ctx.beginPath();
  ctx.arc(0, -38, 3, 0, Math.PI * 2);
  fillStroke("#8a5a34");
  ctx.restore();
}

function drawChicken(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(0, 10, 12, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, 0, 11, 9, 0, 0, Math.PI * 2);
  fillStroke("#f5f0e6");
  ctx.beginPath();
  ctx.ellipse(9, -8, 6, 5.5, 0, 0, Math.PI * 2);
  fillStroke("#f5f0e6");
  ctx.beginPath();
  ctx.moveTo(12, -13);
  ctx.lineTo(16, -15);
  ctx.lineTo(13, -9);
  ctx.closePath();
  fillStroke("#e8433a");
  ctx.beginPath();
  ctx.moveTo(15, -8);
  ctx.lineTo(21, -7);
  ctx.lineTo(15, -5);
  ctx.closePath();
  fillStroke("#f0a23c");
  ctx.fillStyle = "#2a2420";
  ctx.beginPath();
  ctx.arc(11, -9, 1.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFencePost(cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath();
  ctx.ellipse(0, 20, 14, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  // dois mourões brancos com topo arredondado (cerca de piquete, não cruz)
  for (const px of [-13, 13]) {
    ctx.beginPath();
    roundRect(px - 3.5, -8, 7, 26, 3);
    fillStroke("#f4ede0");
    ctx.beginPath();
    ctx.moveTo(px - 3.5, -8);
    ctx.lineTo(px, -14);
    ctx.lineTo(px + 3.5, -8);
    ctx.closePath();
    fillStroke("#d1483a");
  }
  // travessas horizontais
  for (const ly of [0, 10]) {
    ctx.beginPath();
    roundRect(-16, ly, 32, 4.5, 2);
    fillStroke("#f4ede0");
  }
  ctx.restore();
}

function drawDecorations() {
  drawHouse();
  for (let i = -1; i <= COLS; i++) {
    const [fx, fy] = tileCenter(i, -1);
    drawFencePost(fx, fy + 6);
  }
  for (let i = -1; i <= ROWS; i++) {
    const [fx, fy] = tileCenter(-1, i);
    drawFencePost(fx, fy + 6);
  }
}

/* ---------------- Cena ---------------- */

function drawScene() {
  const order = [...Array(COLS * ROWS).keys()].sort(
    (a, b) => (a % COLS + ((a / COLS) | 0)) - (b % COLS + ((b / COLS) | 0))
  );
  const now = performance.now() / 1000;
  for (const index of order) {
    const col = index % COLS, row = (index / COLS) | 0;
    const [cx, cy] = tileCenter(col, row);
    const plot = plots[index];

    if (!plot.unlocked) {
      drawTileLocked(cx, cy);
      ctx.fillStyle = "#ffd23c";
      ctx.font = "bold 13px Trebuchet MS";
      ctx.textAlign = "center";
      ctx.fillText(`${plot.custoOuro} ouro`, cx, cy + 24);
      continue;
    }

    if (plot.crop !== null) drawTileSoil(cx, cy, index * 17.3);
    else drawTileGrass(cx, cy, index * 17.3);

    if (plot.crop === null) continue;

    const crop = CROPS[plot.crop];
    const elapsed = now - plot.plantedAt;
    const pct = Math.max(0, Math.min(1, elapsed / crop.tempo));
    const pronto = pct >= 1.0;

    if (pronto) {
      const glow = 3 + Math.abs(((now * 3) % 2) - 1) * 3;
      ctx.save();
      ctx.strokeStyle = "#ffff78";
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.ellipse(cx, cy + 2, TILE_W / 2 - glow, 12, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    drawCrop(cx, cy, plot.crop, pct);

    if (!pronto) {
      const barW = 60, barX = cx - barW / 2, barY = cy + 22;
      ctx.fillStyle = "rgba(40,30,20,0.7)";
      roundRect(barX, barY, barW, 6, 3); ctx.fill();
      ctx.fillStyle = "#7cd66a";
      roundRect(barX, barY, barW * pct, 6, 3); ctx.fill();
    }

    if (plot.pest) drawPest(cx, cy - 30, now);
  }
}

function drawPest(cx, cy, now) {
  const bob = Math.sin(now * 8) * 3;
  ctx.save();
  ctx.translate(cx, cy + bob);
  ctx.beginPath();
  ctx.ellipse(0, 0, 8, 6, 0, 0, Math.PI * 2);
  fillStroke("#5a4a8a");
  ctx.beginPath();
  ctx.arc(-6, -1, 3.5, 0, Math.PI * 2);
  fillStroke("#5a4a8a");
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 1.5;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(-2, 5 * s * 0.6);
    ctx.lineTo(6, 8 * s);
    ctx.stroke();
  }
  ctx.fillStyle = "#fdf6e3";
  ctx.beginPath(); ctx.arc(-7.5, -2, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ---------------- HUD ---------------- */

function drawHud() {
  const grad = ctx.createLinearGradient(0, 0, 0, 66);
  grad.addColorStop(0, "#5a4128");
  grad.addColorStop(1, "#42311f");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, 66);
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 62, BASE_W, 4);

  ctx.fillStyle = "#fdf6e3";
  ctx.font = "bold 24px Trebuchet MS";
  ctx.textAlign = "left";
  ctx.fillText("Mini Fazenda", 18, 30);

  ctx.fillStyle = "#ffd23c";
  ctx.font = "bold 16px Trebuchet MS";
  ctx.fillText(`Nivel ${state.nivel}`, 18, 52);

  const barX = 108, barY = 40, barW = 150, barH = 12;
  ctx.fillStyle = "#2b2015";
  roundRect(barX, barY, barW, barH, 5); ctx.fill();
  const pct = Math.max(0, Math.min(1, state.xp / state.xpMeta));
  const xpGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  xpGrad.addColorStop(0, "#ff9d3c");
  xpGrad.addColorStop(1, "#ffd23c");
  ctx.fillStyle = xpGrad;
  roundRect(barX, barY, barW * pct, barH, 5); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = 1.5;
  roundRect(barX, barY, barW, barH, 5); ctx.stroke();

  drawCoinIcon(300, 22, "#fff08c", "#c9a52a");
  ctx.fillStyle = "#fff08c";
  ctx.font = "bold 17px Trebuchet MS";
  ctx.fillText(`${state.moedas}`, 320, 27);

  drawCoinIcon(300, 48, "#ffd23c", "#a8791a");
  ctx.fillStyle = "#ffd23c";
  ctx.fillText(`${state.ouro}`, 320, 53);

  ctx.fillStyle = "rgba(255,255,255,0.65)";
  ctx.font = "12px Trebuchet MS";
  ctx.textAlign = "right";
  ctx.fillText("Browser edition", BASE_W - 18, 24);
  ctx.textAlign = "left";
}

function drawCoinIcon(cx, cy, colorA, colorB) {
  const grad = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, 10);
  grad.addColorStop(0, colorA);
  grad.addColorStop(1, colorB);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.3)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

/* ---------------- Botões de semente ---------------- */

function drawCropButtons() {
  const disponiveis = cropsDisponiveis();
  CROP_ORDER.forEach((cropId, i) => {
    const r = cropButtonRect(i);
    const crop = CROPS[cropId];
    const bloqueado = !disponiveis.includes(cropId);
    ctx.fillStyle = bloqueado ? "#332821" : "#5a4128";
    roundRect(r.x, r.y, r.w, r.h, 10);
    ctx.fill();
    ctx.strokeStyle = (cropId === state.selectedCrop && !bloqueado) ? "#fdf6e3" : "rgba(0,0,0,0.35)";
    ctx.lineWidth = 3;
    roundRect(r.x, r.y, r.w, r.h, 10);
    ctx.stroke();

    drawCrop(r.x + 32, r.y + 38, cropId, bloqueado ? 0.2 : 1.0);

    if (bloqueado) {
      ctx.fillStyle = "#9a9a9a";
      ctx.font = "bold 16px Trebuchet MS";
      ctx.fillText(`${crop.nome} (Nv.${crop.nivelMin})`, r.x + 60, r.y + 32);
    } else {
      ctx.fillStyle = "#fdf6e3";
      ctx.font = "bold 16px Trebuchet MS";
      ctx.fillText(crop.nome, r.x + 60, r.y + 22);
      ctx.fillStyle = "#d8cdb8";
      ctx.font = "12px Trebuchet MS";
      ctx.fillText(`${crop.custo} moedas | ${crop.tempo}s | vende ${crop.venda}`, r.x + 60, r.y + 44);
    }
  });
}

/* ---------------- Floaters ---------------- */

function drawFloaters() {
  const now = performance.now();
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    const dt = (now - f.t0) / 1000;
    if (dt > 1.2) { floaters.splice(i, 1); continue; }
    const offset = dt * 30;
    ctx.globalAlpha = Math.max(0, 1 - dt / 1.2);
    ctx.fillStyle = f.color;
    ctx.font = "bold 17px Trebuchet MS";
    ctx.fillText(f.text, f.pos[0], f.pos[1] - offset);
    ctx.globalAlpha = 1;
  }
}

/* ---------------- Loop principal ---------------- */

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, BASE_H);
  grad.addColorStop(0, "#bfe3ec");
  grad.addColorStop(0.45, "#cdeab4");
  grad.addColorStop(1, "#9fd47f");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, BASE_W, BASE_H);
}

function drawEventBanner(now) {
  const ev = state.event;
  if (!ev) return;
  const pct = Math.max(0, 1 - (now - ev.startedAt) / ev.duration);
  const y = 70, w = 360, h = 40, x = BASE_W / 2 - w / 2;
  ctx.save();
  ctx.beginPath();
  roundRect(x, y, w, h, 10);
  fillStroke(ev.type === "praga" ? "#5a4a8a" : "#3f6b3a");
  ctx.fillStyle = "#fdf6e3";
  ctx.font = "bold 14px Trebuchet MS";
  ctx.textAlign = "center";
  const label = ev.type === "praga"
    ? "Praga na lavoura! Clique na planta pra espantar"
    : `Encomenda: ${ev.coletado}/${ev.qtd} ${CROPS[ev.cropId].nome}`;
  ctx.fillText(label, BASE_W / 2, y + 18);
  const barW = w - 20, barX = x + 10, barY = y + 26;
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  roundRect(barX, barY, barW, 6, 3); ctx.fill();
  ctx.fillStyle = ev.type === "praga" ? "#c7a3ff" : "#ffd23c";
  roundRect(barX, barY, barW * pct, 6, 3); ctx.fill();
  ctx.textAlign = "left";
  ctx.restore();
}

function frame() {
  const now = performance.now() / 1000;
  updateEventos(now);
  drawSky();
  drawDecorations();
  drawScene();
  drawHud();
  drawEventBanner(now);
  drawCropButtons();
  drawFloaters();
  requestAnimationFrame(frame);
}

/* ---------------- Interação ---------------- */

function handleClick(px, py) {
  for (let i = 0; i < CROP_ORDER.length; i++) {
    const r = cropButtonRect(i);
    if (rectContains(r, px, py)) {
      const cropId = CROP_ORDER[i];
      if (cropsDisponiveis().includes(cropId)) state.selectedCrop = cropId;
      return;
    }
  }
  for (let index = 0; index < COLS * ROWS; index++) {
    const col = index % COLS, row = (index / COLS) | 0;
    if (pointInTile(px, py, col, row)) {
      const plot = plots[index];
      if (plot.pest) { espantarPraga(index); return; }
      if (!plot.unlocked) tentarDesbloquear(index);
      else if (plot.crop === null) tentarPlantar(index);
      else tentarColher(index);
      return;
    }
  }
}

canvas.addEventListener("click", (ev) => {
  const rect = canvas.getBoundingClientRect();
  const px = ((ev.clientX - rect.left) / rect.width) * BASE_W;
  const py = ((ev.clientY - rect.top) / rect.height) * BASE_H;
  handleClick(px, py);
});
canvas.addEventListener("touchstart", (ev) => {
  ev.preventDefault();
  const t = ev.changedTouches[0];
  const rect = canvas.getBoundingClientRect();
  const px = ((t.clientX - rect.left) / rect.width) * BASE_W;
  const py = ((t.clientY - rect.top) / rect.height) * BASE_H;
  handleClick(px, py);
}, { passive: false });

resize();
requestAnimationFrame(frame);
</script>
